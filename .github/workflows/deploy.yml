
name: Deploy to Nekoweb

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: deploy2nekoweb

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Nekoweb
        uses: mp-pinheiro/nekoweb-deploy@0.3.0
        with:
          API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          BUILD_DIR: '.'
          DEPLOY_DIR: '/lorenzo.nekoweb.org'
          NEKOWEB_PAGENAME: 'lorenzo'
          CLEANUP: 'True'
          DELAY: '0.5'
