name: Deploy to Nekoweb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p _nekoweb-build
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/_nekoweb-build/' \
            ./ _nekoweb-build/
      - name: Create redirect page
        run: |
          cat > _nekoweb-build/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://lorenzo.nya.je/">
            <meta name="robots" content="noindex">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://lorenzo.nya.je/">lorenzo.nya.je</a>...</p>
          </body>
          </html>
          EOF
      - name: Deploy to Nekoweb
        uses: mp-pinheiro/nekoweb-deploy@0.3.0
        with:
          API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          BUILD_DIR: './_nekoweb-build'
          DEPLOY_DIR: '/lorenzo.nekoweb.org'
          NEKOWEB_PAGENAME: 'lorenzo'
          CLEANUP: 'True'
          DELAY: '5'
          RETRY_ATTEMPTS: '5'
          RETRY_DELAY: '2'
          RETRY_EXP_BACKOFF: 'True'
